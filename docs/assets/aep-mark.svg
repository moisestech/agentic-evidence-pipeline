<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Agentic Evidence Pipeline mark: cited evidence nodes resolving into an approved decision">
  <title>Agentic Evidence Pipeline</title>
  <!-- Paper / ink / cyan / coral / mint -->
  <rect width="96" height="96" fill="#F0EEE5"/>
  <!-- Left citation bracket -->
  <path d="M28 22 H18 V74 H28" fill="none" stroke="#10110F" stroke-width="3.5" stroke-linecap="square"/>
  <!-- Right citation bracket -->
  <path d="M68 22 H78 V74 H68" fill="none" stroke="#10110F" stroke-width="3.5" stroke-linecap="square"/>
  <!-- Evidence nodes -->
  <circle cx="38" cy="36" r="5.5" fill="#86D7E2" stroke="#10110F" stroke-width="1.5"/>
  <circle cx="50" cy="48" r="5.5" fill="#86D7E2" stroke="#10110F" stroke-width="1.5"/>
  <circle cx="38" cy="60" r="5.5" fill="#86D7E2" stroke="#10110F" stroke-width="1.5"/>
  <!-- Connections -->
  <path d="M38 41.5 L50 42.5 M50 53.5 L38 54.5" fill="none" stroke="#10110F" stroke-width="1.75"/>
  <!-- Exit to approval -->
  <path d="M55.5 48 H66" fill="none" stroke="#10110F" stroke-width="1.75"/>
  <rect x="66" y="42" width="12" height="12" fill="#B6E2BA" stroke="#10110F" stroke-width="1.5"/>
</svg>
